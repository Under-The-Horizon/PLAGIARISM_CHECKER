<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inspect Document Match</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .text-box { height: 75vh; overflow-y: auto; background: white; padding: 2rem; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        p { white-space: pre-wrap; font-size: 1rem; line-height: 2; color: #334155; }
        mark { padding: 0.1rem 0.2rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark py-3 mb-4 shadow-sm">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="bi bi-search me-2 text-info"></i> Detailed Match Inspection</span>
            <span class="badge bg-danger fs-5 px-3 py-2 border border-light shadow-sm">{{ score }}% Exact Text Match</span>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold py-3 fs-5">
                        <i class="bi bi-file-earmark-text me-2"></i> Target File: {{ file1 }}
                    </div>
                    <div class="card-body p-0">
                        <div class="text-box">{{ text1 | safe }}</div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold py-3 fs-5">
                        <i class="bi bi-file-earmark-text me-2"></i> Matched File: {{ file2 }}
                    </div>
                    <div class="card-body p-0">
                        <div class="text-box">{{ text2 | safe }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
